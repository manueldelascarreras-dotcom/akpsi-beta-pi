<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pledge CMS · Beta Pi</title>
  <link rel="icon" href="images/crest.png" type="image/png">
  <link rel="stylesheet" href="admin.css" />
  <!-- Writes Excel files in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

  <!-- Login / first-time setup -->
  <div class="auth" id="auth" hidden>
    <form class="auth-card" id="authForm">
      <img src="images/crest.png" alt="" />
      <h1>Pledge CMS</h1>
      <p id="authText">Log in to see what pledges turned in, when, and how it was graded.</p>
      <input type="password" id="authPass" placeholder="Password" aria-label="Password" autocomplete="current-password" required />
      <input type="password" id="authPass2" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password" hidden />
      <button class="btn primary" type="submit" id="authBtn">Log in</button>
      <p class="auth-error" id="authError" role="alert"></p>
    </form>
  </div>

  <!-- App -->
  <div class="shell" id="app" hidden>
    <aside class="side" id="side">
      <div class="brand"><img src="images/crest.png" alt="" /><div><b>Beta Pi</b><span>Pledge CMS</span></div></div>
      <nav id="sideNav" aria-label="Sections"></nav>
      <div class="side-foot">
        <a href="./" target="_blank" rel="noopener">Open pledge portal ↗</a>
        <button type="button" id="changePass">Change password</button>
        <button type="button" id="logout">Log out</button>
      </div>
    </aside>
    <div class="content">
      <div class="mobile-top">
        <button type="button" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <img src="images/crest.png" alt="" /><b>Pledge CMS</b>
      </div>
      <main class="main" id="view"></main>
    </div>
  </div>

  <!-- Pledge detail sheet -->
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" aria-label="Pledge details" inert></aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="admin.js"></script>
</body>
</html>
